# ~/.config/starship-oneline.toml — same modules as starship.toml, but the
# ❯ stays glued to the end of the info line instead of dropping to its own
# line. Toggle with:  prompt-layout one   /   prompt-layout two

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch$git_state$git_status$git_metrics${custom.gh}\
$nodejs$python$golang$rust$java\
$pulumi$terraform\
${custom.kube_danger}$kubernetes${custom.kubeconfig}\
$aws$gcloud$azure\
$docker_context\
$cmd_duration $character"""

add_newline = true
command_timeout = 500
scan_timeout = 30

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

# ── path: two components max, like Tide's …/infra-base ──────────────────
[directory]
style = 'bold cyan'
truncation_length = 2
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' 󰌾'

# ── branch: THE fix. Your ticket branches are 50+ chars. ────────────────
[git_branch]
symbol = ' '
style = 'bold purple'
format = '[$symbol$branch]($style) '
truncation_length = 24
truncation_symbol = '…'
ignore_branches = []

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = 'bold yellow'

# Spaced, unbracketed — reads as *99 !4 ?1 instead of [$99!4?1]
[git_status]
style = 'red'
format = '([$all_status$ahead_behind]($style))'
conflicted = '~${count} '
stashed = '*${count} '
deleted = '✘${count} '
renamed = '»${count} '
modified = '!${count} '
staged = '+${count} '
untracked = '?${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '

# +194-25 line churn. Tide doesn't show this; off by default now.
# Flip to false if you liked it.
[git_metrics]
disabled = true
format = '([+$added]($added_style))([-$deleted]($deleted_style)) '

[custom.gh]
description = 'GitHub PR number, CI rollup, review decision'
command = 'gh-prompt'
when = 'git rev-parse --git-dir >/dev/null 2>&1'
shell = ['bash', '--norc', '--noprofile']
format = '[ $output]($style) '
style = 'bold 111'

# ── kubernetes ──────────────────────────────────────────────────────────
# The -prod suffix is stripped because the red PROD badge already says it.
# Result: "PROD ☸ nitrocloud" rather than "PROD ☸ nitrocloud-prod".
[kubernetes]
disabled = false
symbol = '󱃾 '
style = 'bold cyan'
format = '[$symbol$context( \($namespace\))]($style) '

[kubernetes.context_aliases]
'arn:aws:eks:[^:]+:\d+:cluster/(?P<var_cluster>[\w-]+)' = 'eks/$var_cluster'
'gke_[^_]+_[^_]+_(?P<var_cluster>[\w-]+)' = 'gke/$var_cluster'
'^(?P<var_cluster>[\w-]+)-(prod|prd|production)$' = '$var_cluster'
'^(?P<var_cluster>[\w-]+)-aks$' = 'aks/$var_cluster'

[custom.kube_danger]
description = 'PROD warning badge'
command = 'echo PROD'
when = 'kubectl config current-context 2>/dev/null | grep -qiE "prod|prd|live"'
shell = ['bash', '--norc', '--noprofile']
format = '[ $output ]($style) '
style = 'bold white bg:red'

[custom.kubeconfig]
description = 'non-default KUBECONFIG'
command = 'basename "${KUBECONFIG%%:*}"'
when = '[ -n "$KUBECONFIG" ] && [ "$KUBECONFIG" != "$HOME/.kube/config" ]'
shell = ['bash', '--norc', '--noprofile']
format = '[󰈔 $output]($style) '
style = 'bold blue'

# ── IaC ─────────────────────────────────────────────────────────────────
[pulumi]
symbol = ' '
style = 'bold 5'
format = '[$symbol$stack]($style) '
search_upwards = true

[terraform]
symbol = '󱁢 '
style = 'bold 105'
format = '[$symbol$workspace]($style) '
detect_folders = ['.terraform', '.terragrunt-cache']
detect_extensions = ['tf', 'tfplan', 'tfstate', 'hcl']

[aws]
symbol = ' '
style = 'bold yellow'
format = '[$symbol$profile(\($region\))]($style) '

[aws.region_aliases]
ap-south-1 = 'mum'
us-east-1 = 'va'
eu-west-1 = 'ire'

[gcloud]
symbol = '󱇶 '
format = '[$symbol$project]($style) '

[azure]
disabled = false
symbol = '󰠅 '
format = '[$symbol($subscription)]($style) '

[docker_context]
symbol = ' '
format = '[$symbol$context]($style) '
only_with_files = true

# ── runtimes: explicit format kills starship's "via " prefix ────────────
[nodejs]
symbol = '⬢ '
format = '[$symbol$version]($style) '
detect_files = ['package.json', '.nvmrc']
detect_folders = ['node_modules']

[python]
symbol = ' '
format = '[$symbol$version(\($virtualenv\))]($style) '

[golang]
symbol = ' '
format = '[$symbol$version]($style) '

[rust]
symbol = ' '
format = '[$symbol$version]($style) '

[java]
symbol = ' '
format = '[$symbol$version]($style) '

[cmd_duration]
min_time = 500
style = 'bold yellow'
format = '[󱎫 $duration]($style) '
